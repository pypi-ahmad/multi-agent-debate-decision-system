[project]
name = "debate-decision-system"
version = "0.3.1"
description = "Multi-agent debate system for structured decision making"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ahmad Mujtaba", email = "72138709+pypi-ahmad@users.noreply.github.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "lancedb>=0.37.1",
    "langchain-core>=1.5.5",
    "langchain-google-genai>=4.3.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
]

[project.scripts]
debate-decision-system = "debate_decision_system:main"

[project.urls]
Homepage = "https://github.com/pypi-ahmad/multi-agent-debate-decision-system"
Repository = "https://github.com/pypi-ahmad/multi-agent-debate-decision-system"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "audit" },
]
lint = [
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
audit = [
    "pip-audit>=2.10.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
    "ISC001",
    "TC",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "PLR2004",
    "ANN",
]
"__init__.py" = [
    "F401",
]
"app.py" = [
    "INP001",
]
"app_pages/**/*.py" = [
    "INP001",
]

[tool.ruff.lint.isort]
known-first-party = ["debate_decision_system"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=debate_decision_system",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = ["src/debate_decision_system"]
omit = [
    "*/__main__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80
show_missing = true

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"
